name: Manager tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python bin/deadlock-mac --help
      - name: Check native app source
        if: matrix.os == 'macos-14' && matrix.python == '3.13'
        run: xcrun swiftc -typecheck -parse-as-library -target arm64-apple-macos15.0 packaging/ManagerLifecycle.swift packaging/DeadlockManager.swift
      - name: Test manager quit lifecycle without a game
        if: matrix.os == 'macos-14' && matrix.python == '3.13'
        run: |
          xcrun swiftc packaging/ManagerLifecycle.swift tests/native/manager_lifecycle_test.swift -o "$RUNNER_TEMP/manager-lifecycle-test"
          "$RUNNER_TEMP/manager-lifecycle-test"
